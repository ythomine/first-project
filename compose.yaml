services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-revenue_app}
      POSTGRES_USER: ${DB_USER:-revenue_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
